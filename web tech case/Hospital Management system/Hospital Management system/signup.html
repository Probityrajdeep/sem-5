<!DOCTYPE html>
<html>

<head>

    <title>Signup - MedCare Hospital</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f9ff;
            text-align: center;
        }

        .header {
            background-color: #008080;
            color: white;
            padding: 20px;
        }

        .signup-box {
            background-color: white;
            width: 350px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
        }

        button {
            background-color: #008080;
            color: white;
            border: none;
            padding: 12px 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            color: #008080;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>MedCare Hospital</h1>

        <p>Patient Management System</p>

    </div>


    <div class="signup-box">

        <h2>Create Account</h2>


        <form>

            <input
                type="text"
                placeholder="Enter Full Name"
                required
            >

            <br>

            <input
                type="email"
                placeholder="Enter Email"
                required
            >

            <br>

            <input
                type="tel"
                placeholder="Enter Phone Number"
                required
            >

            <br>

            <input
                type="password"
                placeholder="Create Password"
                required
            >

            <br>

            <input
                type="password"
                placeholder="Confirm Password"
                required
            >

            <br>

            <button type="submit">
                Sign Up
            </button>

        </form>


        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>


        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </div>


</body>

</html>
