<!DOCTYPE html>
<html>

<head>

    <title>Login - MedCare Hospital</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f2f9ff;
            text-align: center;
        }

        .header {
            background-color: #008080;
            color: white;
            padding: 20px;
        }

        .login-box {
            background-color: white;
            width: 350px;
            margin: 60px auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px;
        }

        button {
            background-color: #008080;
            color: white;
            border: none;
            padding: 12px 30px;
            margin-top: 10px;
            cursor: pointer;
        }

        a {
            color: #008080;
            text-decoration: none;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>MedCare Hospital</h1>

        <p>Patient Management System</p>

    </div>


    <div class="login-box">

        <h2>Login</h2>

        <form>

            <input
                type="email"
                placeholder="Enter Email"
                required
            >

            <br>

            <input
                type="password"
                placeholder="Enter Password"
                required
            >

            <br>

            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>


        <p>
            <a href="index.html">Back to Home</a>
        </p>

    </div>


</body>

</html>
