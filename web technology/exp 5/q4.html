<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
</head>
<body>
    <h1>Student Login and Profile</h1>
    <form>
        Username: <input type="text" name="username"><br><br>
        Email: <input type="email" name="email"><br><br>
        Password: <input type="password" name="password"><br><br>
        Confirm Password: <input type="password" name="confirm"><br><br>
        Profile Photograph: <input type="file" name="photo"><br><br>
        <input type="checkbox" name="terms"> I accept the terms and conditions<br><br>
        <input type="submit" value="Create Profile">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
