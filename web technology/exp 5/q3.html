<!DOCTYPE html>
<html>
<head>
    <title>College Admission</title>
</head>
<body>
    <h1>College Admission Form</h1>
    <form>
        Student Name: <input type="text" name="name"><br><br>
        Date of Birth: <input type="date" name="dob"><br><br>
        Previous Qualification: <input type="text" name="qualification"><br><br>
        Marks: <input type="number" name="marks"><br><br>
        Programme:
        <select name="programme">
            <option>BCA</option>
            <option>BBA</option>
            <option>B.Sc.</option>
            <option>B.A.</option>
        </select><br><br>
        Email: <input type="email" name="email"><br><br>
        Phone: <input type="tel" name="phone"><br><br>
        Address:<br>
        <textarea name="address" rows="3" cols="30"></textarea><br><br>
        <input type="submit" value="Apply">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
