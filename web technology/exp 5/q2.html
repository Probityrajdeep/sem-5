<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body>
    <h1>Online Course Registration</h1>
    <form>
        Name: <input type="text" name="name"><br><br>
        Email: <input type="email" name="email"><br><br>

        Study Mode:
        <input type="radio" name="mode" value="online"> Online
        <input type="radio" name="mode" value="offline"> Offline<br><br>

        Select Courses:<br>
        <input type="checkbox" name="course" value="html"> HTML
        <input type="checkbox" name="course" value="css"> CSS
        <input type="checkbox" name="course" value="javascript"> JavaScript<br><br>

        Course Level:
        <select name="level">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
        </select><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
