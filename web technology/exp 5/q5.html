<!DOCTYPE html>
<html>
<head>
    <title>Examination Registration</title>
</head>
<body>
    <h1>Examination Registration Form</h1>
    <form>
        Student Name: <input type="text" name="name"><br><br>
        Roll Number: <input type="text" name="roll"><br><br>
        Semester:
        <select name="semester">
            <option>Semester 1</option>
            <option>Semester 2</option>
            <option>Semester 3</option>
            <option>Semester 4</option>
        </select><br><br>
        Subject:
        <select name="subject">
            <option>Web Technology</option>
            <option>Database Management</option>
            <option>Computer Networks</option>
        </select><br><br>
        Examination Centre: <input type="text" name="centre"><br><br>
        <input type="checkbox" name="declaration"> I declare that the information is correct.<br><br>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
